<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocHarvest v11.2.0</title>
    <script>
      // Apply the persisted theme before first paint (avoids a dark flash for
      // users who saved the light theme). Falls back to the "dark" default.
      try {
        if (localStorage.getItem("docharvest_theme") === "light") {
          document.documentElement.classList.remove("dark")
          document.documentElement.classList.add("light")
        }
      } catch (e) { /* storage unavailable: keep dark default */ }
    </script>
    <!-- Fonts are bundled from ./src/styles/brand-tokens.css (@fontsource).
         No CDN request: the desktop app must render identically offline. -->
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/25 selection:text-foreground overflow-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
