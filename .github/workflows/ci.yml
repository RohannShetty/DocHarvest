name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          uv.lock

    - name: Install package with dev + mcp extras
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,mcp]"

    - name: Run tests
      run: python -m pytest tests/ -q --tb=short --timeout=120

    - name: Test CLI help
      run: docharvest --help

    - name: Test the short alias still resolves
      run: gitbook-dl --help

  # The desktop GUI ships inside the wheel, so a broken lint, type error or
  # failed bundle build is a broken release - not a front-end detail.
  gui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install GUI dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint the desktop GUI
      working-directory: frontend
      run: npm run lint

    - name: Typecheck the desktop GUI
      working-directory: frontend
      run: npm run typecheck

    - name: Build the desktop GUI
      working-directory: frontend
      run: npm run build

  # The public showcase is the project's front door; it had lint config and a
  # build but no PR gate. Typecheck + lint run here (both were green at plan
  # time; keep them green).
  showcase:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: docs/package-lock.json

    - name: Install showcase dependencies
      working-directory: docs
      run: npm ci

    - name: Typecheck the showcase
      working-directory: docs
      run: npm run typecheck

    - name: Lint the showcase
      working-directory: docs
      run: npm run lint

  # The brand is generated from brand/tokens.json into three stylesheet/module
  # surfaces and seven drawn assets; these fail the moment someone hand-edits
  # a generated file, changes a value without regenerating, or draws a second
  # logo - which is how the surfaces drifted apart before.
  brand-tokens:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Brand tokens are current
      run: node scripts/sync-brand-tokens.mjs --check

    - name: Drawn brand assets are current
      run: node scripts/build-brand-kit.mjs --check
