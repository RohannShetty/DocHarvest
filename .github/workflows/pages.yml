name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install Dependencies
        working-directory: docs
        run: npm install

      # The published test count is a claim, so it is generated from a real run
      # rather than typed in. A red suite still deploys — the site then says how
      # many tests are failing instead of pretending everything passes.
      - name: Set up Python for the test-count claim
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Record the real test-suite numbers
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
          python -m pytest -q -p no:cacheprovider --tb=no > .pytest-summary.txt 2>&1 || true
          python -m pytest --collect-only -q -p no:cacheprovider >> .pytest-summary.txt 2>&1 || true
          tail -3 .pytest-summary.txt

      - name: Sync marketing stats from that run
        working-directory: docs
        env:
          PYTEST_SUMMARY_FILE: ${{ github.workspace }}/.pytest-summary.txt
        run: node scripts/sync-stats.mjs

      - name: Build Web Showcase
        working-directory: docs
        env:
          GITHUB_ACTIONS: 'true'
          NEXT_PUBLIC_BASE_PATH: '/DocHarvest'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
